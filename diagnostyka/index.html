<style>
/* Layout: one column on graph paper; three tabs (theory, problems, test); hydroxyl teal as the single accent */

  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111716; --grid:#1b2423; --ink:#ecf3f2; --muted:#98a9a7; --card:#182120; --line:#2a3634;
  --oh:#4fc6bd; --oh-bg:#143331;
  --ok:#4fcf8a; --ok-bg:#15342a; --bad:#f07477; --bad-bg:#3a1c1f; --warn-bg:#3a2d12; --warn:#f2c46b;
  --c-stru:#6aa0f5; --c-nom:#b48af2; --c-prop:#5fc28c; --c-react:#f0a35a; --c-prod:#d9a066; --c-calc:#4fc6bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111716; --grid:#1b2423; --ink:#ecf3f2; --muted:#98a9a7; --card:#182120; --line:#2a3634;
  --oh:#4fc6bd; --oh-bg:#143331;
  --ok:#4fcf8a; --ok-bg:#15342a; --bad:#f07477; --bad-bg:#3a1c1f; --warn-bg:#3a2d12; --warn:#f2c46b;
  --c-stru:#6aa0f5; --c-nom:#b48af2; --c-prop:#5fc28c; --c-react:#f0a35a; --c-prod:#d9a066; --c-calc:#4fc6bd; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);

  background-size:24px 24px;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 64px;

  display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,8vw,52px);line-height:1}
h2{font-size:21px;line-height:1.25}
h3{font-size:15px;margin-top:6px}
p{margin:0;max-width:66ch}
.eyebrow{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.hint{font-size:13.5px;color:var(--muted)}
.f{font-family:var(--mono);font-weight:500;font-size:.94em}
sub,sup{font-size:.7em;line-height:0}
.hl{color:var(--oh);font-weight:700}

/* header + tabs */
.head{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ohbadge{font:700 clamp(18px,4.4vw,24px)/1 var(--mono);color:var(--oh);border:2px solid var(--oh);border-radius:10px;padding:6px 10px;background:var(--oh-bg)}
.tabs{display:flex;gap:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card);align-self:flex-start;max-width:100%}
.tab{font:700 15px var(--body);color:var(--ink);background:transparent;border:0;border-right:2px solid var(--ink);padding:10px 20px;cursor:pointer}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.segb:focus-visible,.dot:focus-visible,.toc button:focus-visible{outline:3px solid var(--oh);outline-offset:2px}

/* theory */
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc button,.segb{font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.toc button:hover,.segb:hover{border-color:var(--ink)}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec ul,.sec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.def{border:2px solid var(--oh);background:var(--oh-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.def .big{font:700 clamp(24px,6vw,30px)/1.2 var(--mono);color:var(--ink)}
.lbl{font:700 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sf{margin:0;border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sf pre{margin:0;font:500 15px/1.25 var(--mono);overflow-x:auto}
.sf figcaption{font-size:13px;color:var(--muted)}
.tblw{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}

.example{border-left:4px solid var(--oh);padding:6px 0 6px 14px}

.bar .tr{position:relative;height:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:5px 0 0 5px}

.axis{display:grid;grid-template-columns:minmax(92px,150px) 1fr;gap:10px;font:500 11.5px var(--mono);color:var(--muted)}
.axis div{display:flex;justify-content:space-between}
.rx{display:grid;grid-template-columns:1fr;gap:10px}
.rxi{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rxn{font-weight:700;font-size:14.5px}
.eq{font-family:var(--mono);font-weight:500;font-size:15px;line-height:1.9;overflow-wrap:anywhere}
.arr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:-2px;margin:0 3px}

.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.use{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.use b{display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px var(--mono);border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}

/* tasks */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.task{display:flex;flex-direction:column;gap:14px}
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.count{font:700 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.q{font-size:18px;font-weight:700;line-height:1.5}
.q .f{font-size:.95em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:500 16px/1.45 var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font:700 13px var(--mono);border:2px solid currentColor;border-radius:6px;min-width:26px;height:26px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)} .opt.sel .k{color:var(--card);background:var(--ink);border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{color:var(--bad)}
.inrow{display:flex;align-items:stretch;max-width:360px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.inrow:focus-within{border-color:var(--ink)}
.inrow input{flex:1;min-width:0;font:500 17px var(--mono);color:var(--ink);background:transparent;border:0;padding:11px 14px;outline:none}
.unit{display:grid;place-items:center;padding:0 14px;font:700 14px var(--mono);color:var(--muted);border-left:2px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field input{font:500 16px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
.field input:focus{outline:none;border-color:var(--ink)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
.fb{border-left:4px solid var(--ink);padding:4px 0 4px 14px;font-size:15.5px}
.fb.ok{border-color:var(--ok)} .fb.ok b{color:var(--ok)}
.fb.bad{border-color:var(--bad)} .fb.bad b{color:var(--bad)}
.solbox{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.steps li::marker{font:700 13px var(--mono);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 15.5px var(--body);border:2px solid var(--ink);background:var(--ink);color:var(--card);border-radius:10px;padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--muted);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--muted)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--muted)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;font-size:14.5px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card);font:700 13px var(--mono);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--oh-bg);border-color:var(--oh);color:var(--ink)}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.score{display:flex;align-items:baseline;gap:12px}
.score .big{font:700 clamp(58px,15vw,84px)/1 var(--display)}
.score .of{font:700 20px var(--mono);color:var(--muted)}
.send{font-weight:700;font-size:14.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.send.ok{color:var(--ok)} .send.fail{color:var(--bad)} .send.wait{color:var(--muted)}
.review{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.review li{display:grid;grid-template-columns:26px 1fr;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.review li.bad{border-color:var(--bad)}
.review .m{font:700 16px var(--mono)}
.review li.ok .m{color:var(--ok)} .review li.bad .m{color:var(--bad)}
.review .rb{display:flex;flex-direction:column;gap:3px;font-size:15px;min-width:0}
.review .yours{color:var(--bad)} .review .right{color:var(--ok)}
.review .why{margin-top:4px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
footer{font-size:13px;color:var(--muted);text-align:center}

/* чернетка (signature_pad) */
.draft-fab{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:700 15px var(--body);display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--oh);color:#fff;border-radius:999px;padding:11px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.draft-fab svg{width:18px;height:18px}
.draft-fab:focus-visible,.dt:focus-visible{outline:3px solid var(--oh);outline-offset:2px}
.draft{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:2px solid var(--ink);box-shadow:-6px 0 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.draft-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line)}
.draft-bar .ttl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.draft-bar .sp{flex:1}
.dt svg{width:17px;height:17px}
.draft-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dt{font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:9px;min-width:36px;height:36px;padding:0 10px;cursor:pointer;display:inline-grid;place-items:center}
.dt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dt i{display:block;width:16px;height:16px;border-radius:50%}
.dt.warn{border-color:var(--bad);color:var(--bad)}
.draft-area{position:relative;flex:1;min-height:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.draft-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.draft-msg{position:absolute;inset:auto 16px 16px 16px;background:var(--card);border:2px solid var(--bad);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14.5px}
.draft-hint{position:absolute;left:12px;bottom:14px;font-size:12.5px;color:var(--muted);pointer-events:none}

.zoombar{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px;z-index:2}
.zoombar .dt{min-width:32px;height:32px;border:0}
.zoombar .zl{font:700 12.5px var(--mono);font-variant-numeric:tabular-nums;min-width:52px}
.draft-area.hand canvas{cursor:grab}
.draft-area.panning canvas{cursor:grabbing}
@media (max-width:700px){
  .draft{top:auto;left:0;width:auto;height:60vh;border-left:0;border-top:2px solid var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 0 rgba(0,0,0,.08);padding-left:env(safe-area-inset-left,0px)}
  body.draft-on .wrap{padding-bottom:62vh}
}
@media (min-width:701px){ body.draft-on{padding-right:460px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<style>
.blocks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.blk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.blk .bn{font-weight:700}
.blk .bs{font:700 15px var(--mono);font-variant-numeric:tabular-nums}

.blk.low .bt i{background:var(--bad)}
.blk .yr{font-weight:500;color:var(--muted);font-size:13px}
.classes{display:flex;flex-wrap:wrap;gap:8px}
.idk{font-style:italic;color:var(--muted)}

<div class="wrap">

<script>
// Посилання на веб-застосунок Google Apps Script (закінчується на /exec)
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwJt0FC8AbiZQi9ZByBeCdRuD8BOnVZMpK2fuoZ2KJNqt8k7bayhczqiv_50-ftWhumeA/exec';

/* ---------- утиліти ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const round = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
const fmt = (x, d = 2) => String(round(x, d)).replace('.', ',').replace('-', '−');
const SUBD = '₀₁₂₃₄₅₆₇₈₉';
const fHTML = s => s.replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>');
const F = s => `<span class="f">${fHTML(s)}</span>`;
const plain = h => String(h).replace(/<sub>(\d+)<\/sub>/g, (m, d) => [...d].map(c => SUBD[c]).join('')).replace(/<sup>([^<]*)<\/sup>/g, '^$1')
  .replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
function parseNum(raw) {
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '').replace(/,/g, '.').replace(/[−–]/g, '-').replace(/(г\/моль|моль|г|л|%)$/, '');
  return /^-?\d+(?:\.\d+)?$/.test(s) ? +s : NaN;
}

/* ---------- блоки знань ---------- */
const BL = {
  '7a': { l:'Речовини та явища', y:7 },

      return num({ q:`У ${mv} г води розчинили ${ms} г солі. Яка масова частка солі в розчині (%)?`, x:w, d:1, unit:'%', tol:0.3, e:`w = ${ms} / (${ms} + ${mv}) · 100 % ≈ ${fmt(w, 1)} %` }); }
  ],
  '8b': [
    () => { const [f, M] = pick(MR.filter(x => Number.isInteger(x[1]))), n = pick([0.1, 0.2, 0.25, 0.5, 2, 3]); return num({ q:`Яка кількість речовини в ${fmt(n * M, 2)} г ${F(f)}?`, x:n, unit:'моль', tol:0.01, e:`n = m / M = ${fmt(n * M, 2)} / ${M} = ${fmt(n)} моль` }); },
    () => { const [f, M] = pick(MR.filter(x => Number.isInteger(x[1]))), n = pick([0.1, 0.2, 0.5, 1.5, 2, 3]); return num({ q:`Обчисліть масу ${fmt(n)} моль ${F(f)}.`, x:n * M, unit:'г', tol:0.05, e:`m = n · M = ${fmt(n)} · ${M} = ${fmt(n * M)} г` }); }
  ],
  '8c': [
    () => { const [nm, f] = pick(GAS), n = pick([0.1, 0.25, 0.5, 1.5, 2, 3]); return num({ q:`Який об'єм (н.у.) займають ${fmt(n)} моль ${nm}?`, x:n * 22.4, unit:'л', tol:0.05, e:`V = n · 22,4 = ${fmt(n * 22.4)} л` }); },
    () => { const [nm, f, M] = pick(GAS); return num({ q:`Обчисліть відносну густину ${nm} ${F(f)} за воднем.`, x:M / 2, d:1, tol:0.05, e:`D(H₂) = M / 2 = ${M} / 2 = ${fmt(M / 2, 1)}` }); }
  ],
  '9a': [
    () => { const m = pick([50, 80, 100, 150, 200, 250, 300, 400]), w = pick([5, 10, 15, 20, 25]); return num({ q:`Яка маса солі в ${m} г розчину з масовою часткою ${w} %?`, x:m * w / 100, unit:'г', tol:0.05, e:`m(солі) = ${m} · ${w / 100} = ${fmt(m * w / 100)} г` }); },
    () => { const m = pick([100, 200]), w = pick([10, 20, 30]), add = pick([50, 100, 200]); const w2 = m * w / (m + add); return num({ q:`До ${m} г розчину з масовою часткою солі ${w} % долили ${add} г води. Обчисліть нову масову частку (%).`, x:w2, d:1, unit:'%', tol:0.2, e:`m(солі) = ${fmt(m * w / 100)} г; w = ${fmt(m * w / 100)} / ${m + add} · 100 % ≈ ${fmt(w2, 1)} %` }); }
  ]
};

/* ---------- збирання діагностики ---------- */
function makeTask(b) {
  const pool = Q.filter(x => x[0] === b).map(x => ({ k:'q', x })).concat((GENS[b] || []).map(g => ({ k:'g', g })));
  return pool;
}
function buildTest(cls) {
  const list = [];
  PLAN[cls].forEach(b => {
    const n = BL[b].y === +cls ? 3 : 2;
    shuffle(makeTask(b)).slice(0, n).forEach(it => {
      let t;
      if (it.k === 'g') t = it.g();
      else { const [, q, o, e] = it.x; const opts = shuffle(o.map((html, i) => ({ html, right: i === 0 }))); opts.push({ html:'<span class="idk">Не знаю / ще не вчили</span>', right:false, idk:true });
        t = { input:'choice', q, opts, e, right: plain(o[0]), check: a => a !== null && !!opts[a] && opts[a].right }; }
      list.push({ ...t, b, ans: t.input === 'choice' ? null : '' });
    });
  });
  return list;
}

/* ---------- поле відповіді ---------- */
const LETTERS = 'АБВГДЕ';
function area(t) {
  if (t.input === 'choice') return `<div class="opts">${t.opts.map((o, i) => `<button class="opt ${i === t.ans ? 'sel' : ''}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${o.html}</span></button>`).join('')}</div>`;
  return `<div class="inrow"><input id="t-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Відповідь" placeholder="відповідь" value="${esc(t.ans ?? '')}">${t.unit ? `<span class="unit">${t.unit}</span>` : ''}</div>
    <div class="hint">Введи число (десятковий дріб — з комою). Не знаєш — залиш порожнім і натисни «Далі».</div>`;
}
const answered = t => t.input === 'choice' ? t.ans !== null : String(t.ans ?? '').trim() !== '';

/* ================= ДІАГНОСТИКА ================= */
const T = { phase:'start', name:'', cls:'', grade:'', tasks:[], i:0, results:[], sent:'' };
try { T.name = localStorage.getItem('chem_name') || ''; T.cls = localStorage.getItem('chem_group') || ''; } catch (e) {}
{ const h = location.hash.slice(1); if (PLAN[h]) T.grade = h; }
const topicName = () => `Діагностика — ${T.grade} клас`;

function blockStats() {
  const st = {};
  T.results.forEach(r => { const s = st[r.b] ??= { ok:0, n:0 }; s.n++; if (r.ok) s.ok++; });
  return PLAN[T.grade].map(b => ({ b, ...st[b], l: BL[b].l, y: BL[b].y }));
}
function render() {
  const v = $('v-test');
  if (T.phase === 'start') {
    v.innerHTML = `
      <div class="card stack">
        <div><div class="eyebrow">Вступна діагностика</div><h2 style="margin-top:4px">Що ти вже знаєш з хімії</h2></div>
        <p>Це не контрольна і не на оцінку. Тест показує, які теми ти добре розумієш, а які варто повторити, — щоб на заняттях не витрачати час на зайве.</p>
        <div class="row">
          <label class="field">Ім'я та прізвище<input id="t-name" autocomplete="name" placeholder="Напр., Олеся Коваленко" value="${esc(T.name)}"></label>
        </div>
        <div><div class="lbl" style="margin-bottom:8px">Твій клас</div>
          <div class="classes" role="group" aria-label="Клас">${Object.keys(PLAN).map(c => `<button class="segb" data-c="${c}" aria-pressed="${T.grade === c}">${c} клас</button>`).join('')}</div></div>
        <ul class="rules">
          <li>Завдання — від простих тем минулих років до тем цього року.</li>
          <li>Якщо не знаєш відповіді, обери «Не знаю / ще не вчили». Не вгадуй, так результат буде чеснішим.</li>
          <li>Можна користуватися періодичною системою. Займе 20–30 хвилин.</li>
        </ul>
        <div class="actions"><button class="btn" id="t-go">Почати</button></div>
        <div class="err" id="t-err" hidden></div>
      </div>`;
    $('t-name').oninput = e => T.name = e.target.value;
    v.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { T.grade = b.dataset.c; v.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('t-go').onclick = () => {
      const err = m => { $('t-err').textContent = m; $('t-err').hidden = false; };
      if (!T.name.trim()) { err('Впиши ім\'я та прізвище так, як тебе записав вчитель.'); $('t-name').focus(); return; }
      if (!T.grade) { err('Обери свій клас.'); return; }
      try { localStorage.setItem('chem_name', T.name.trim()); } catch (e) {}
      T.cls = T.grade; T.tasks = buildTest(T.grade); T.i = 0; T.phase = 'run'; render(); window.scrollTo({ top:0 });
    };
    return;
  }
  if (T.phase === 'run') {
    const t = T.tasks[T.i], N = T.tasks.length, last = T.i === N - 1;
    v.innerHTML = `
      <div class="dots" role="group" aria-label="Завдання">${T.tasks.map((x, j) => `<button class="dot ${answered(x) ? 'done' : ''} ${j === T.i ? 'cur' : ''}" data-j="${j}" aria-label="Завдання ${j + 1}">${j + 1}</button>`).join('')}</div>
      <div class="card task" style="--c:var(--c-stru)">
        <div class="tline"><span class="tag">${esc(BL[t.b].l)}</span><span class="count">${T.i + 1} / ${N}</span></div>
        <div class="q">${t.q}</div>
        ${area(t)}
        <div class="actions">
          <button class="btn ghost" id="t-prev" ${T.i === 0 ? 'disabled' : ''}>Назад</button>
          ${last ? `<button class="btn" id="t-fin">Завершити</button>` : `<button class="btn" id="t-next">Далі</button>`}
        </div>
      </div>`;
    const go = j => { T.i = j; render(); };
    v.querySelectorAll('.dot').forEach(b => b.onclick = () => go(+b.dataset.j));
    v.querySelectorAll('.opt').forEach(b => b.onclick = () => { t.ans = +b.dataset.i; if (!last) go(T.i + 1); else render(); });
    const inp = $('t-in');
    if (inp) {
      inp.oninput = () => { t.ans = inp.value; v.querySelectorAll('.dot')[T.i].classList.toggle('done', answered(t)); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); last ? finish() : go(T.i + 1); } };
      if (matchMedia('(hover:hover)').matches) inp.focus({ preventScroll:true });
    }
    $('t-prev').onclick = () => go(T.i - 1);
    if ($('t-next')) $('t-next').onclick = () => go(T.i + 1);
    if ($('t-fin')) $('t-fin').onclick = finish;
    return;
  }
  const got = T.results.filter(r => r.ok).length, max = T.results.length, bs = blockStats();
  v.innerHTML = `
    <div class="card stack">
      <div class="eyebrow">${esc(T.name)} · ${T.grade} клас</div>
      <div class="score"><span class="big">${got}</span><span class="of">з ${max}</span></div>
      <div class="send" id="t-send"></div>
    </div>
    <div class="card stack">
      <h2>По темах</h2>
      <ul class="blocks">${bs.map(s => { const p = s.n ? s.ok / s.n : 0; return `<li class="blk ${p >= 0.67 ? '' : p > 0 ? 'mid' : 'low'}"><span class="bn">${esc(s.l)} <span class="yr">· ${s.y} кл.</span></span><span class="bs">${s.ok}/${s.n}</span><span class="bt"><i style="width:${Math.max(4, p * 100)}%"></i></span></li>`; }).join('')}</ul>
      <p class="hint">Зелене — тема зрозуміла, жовте — є прогалини, червоне — варто повторити з вчителем.</p>
    </div>
    <div class="card stack">
      <h2>Розбір</h2>
      <ol class="review">${T.results.map((r, i) => `
        <li class="${r.ok ? 'ok' : 'bad'}"><span class="m">${r.ok ? '✓' : '✗'}</span><div class="rb">
          <b>${i + 1}. ${esc(BL[r.b].l)}</b>
          ${r.ok ? '' : `<div class="yours">Твоя відповідь: ${esc(r.given)}</div><div class="right">Правильно: <b>${esc(r.right)}</b></div>${r.e ? `<div class="why">${r.e}</div>` : ''}`}
        </div></li>`).join('')}</ol>
    </div>`;
  drawSend();
}
function finish() {
  T.results = T.tasks.map(t => ({ b:t.b, ok: answered(t) && t.check(t.ans), right:t.right, e:t.e,
    given: !answered(t) ? '—' : t.input === 'choice' ? (t.opts[t.ans].idk ? 'не знаю' : plain(t.opts[t.ans].html)) : t.ans.trim() }));
  T.phase = 'done'; render(); window.scrollTo({ top:0 }); send();
}
function drawSend() {
  const box = $('t-send'); if (!box) return;
  box.className = 'send ' + (T.sent || 'wait');
  box.innerHTML = T.sent === 'ok' ? 'Результат надіслано вчителю.'
    : T.sent === 'fail' ? `Не вдалося надіслати результат. <button class="btn ghost" id="t-resend">Надіслати ще раз</button>`
    : 'Надсилаю результат вчителю…';
  if ($('t-resend')) $('t-resend').onclick = send;
}
function send() {
  const got = T.results.filter(r => r.ok).length, max = T.results.length, bs = blockStats();
  const weak = bs.find(s => s.ok / s.n < 0.67);
  const details = [`${topicName()}`,
    `Теми: ${bs.map(s => `${s.l} ${s.ok}/${s.n}${s.ok / s.n >= 0.67 ? ' ✓' : s.ok ? ' ⚠' : ' ✗'}`).join('; ')}`,
    `Почати з: ${weak ? weak.l + ` (${weak.y} кл.)` : 'усе базове засвоєно'}`,
    ...T.results.map((r, i) => `${i + 1}. ${BL[r.b].l}: ${r.ok ? '✓' : `✗ «${r.given}», правильно «${r.right}»`}`)].join('\n');
  T.sent = 'wait'; drawSend();
  fetch(SHEET_URL, {
    method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: T.name.trim(), cls: T.grade, topic: topicName(), score: `${got}/${max}`, mark: Math.max(1, Math.round(got / max * 12)), details })
  }).then(() => { T.sent = 'ok'; drawSend(); }).catch(() => { T.sent = 'fail'; drawSend(); });
}
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@5.1.3/dist/signature_pad.umd.min.js"></script>
<script>
/* ================= ЧЕРНЕТКА (signature_pad + масштаб) ================= */
(() => {
  const KEY = 'draft_spyrty';
  const MIN_S = 0.25, MAX_S = 6;
  const box = document.getElementById('draft'), openBtn = document.getElementById('draft-open');
  const canvas = document.getElementById('draft-canvas'), area = document.getElementById('draft-area');
  const msg = document.getElementById('draft-msg'), hint = document.getElementById('draft-hint');
  const clearBtn = document.getElementById('draft-clear'), zl = document.getElementById('zoom-reset');
  const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
  clearBtn.innerHTML = TRASH;
  let pad = null, tool = 'ink', clearArm = null, dpr = 1, spaceHand = false;
  const V = { s: 1, x: 0, y: 0 };          // екран = світ · s + (x, y)
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim() || '#000';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pad.toData())); } catch (e) {} };
  const syncHint = () => { hint.hidden = !!pad && !pad.isEmpty(); };
  const panMode = () => tool === 'hand' || spaceHand;
  // signature_pad.off() вмикає прокрутку сторінки на холсті — повертаємо touch-action: none
  const padOff = () => { pad.off(); canvas.style.touchAction = 'none'; };

  // ---- вигляд ----
  function applyCtx() { canvas.getContext('2d').setTransform(dpr * V.s, 0, 0, dpr * V.s, dpr * V.x, dpr * V.y); }
  function penWidths() {
    if (!pad) return;
    const k = 1 / V.s;   // однакова товщина лінії на екрані за будь-якого масштабу
    if (tool === 'erase') Object.assign(pad, { minWidth: 9 * k, maxWidth: 16 * k });
    else Object.assign(pad, { minWidth: 0.8 * k, maxWidth: 2.6 * k });
    pad.minDistance = 5 * k;
  }
  let raf = 0;
  function redraw() {
    area.style.backgroundSize = `${20 * V.s}px ${20 * V.s}px`;
    area.style.backgroundPosition = `${V.x}px ${V.y}px`;
    zl.textContent = Math.round(V.s * 100) + '%';
    if (!pad) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { applyCtx(); pad.redraw(); });
  }
  function zoomAt(cx, cy, s2) {
    s2 = Math.min(MAX_S, Math.max(MIN_S, s2));
    const wx = (cx - V.x) / V.s, wy = (cy - V.y) / V.s;
    V.s = s2; V.x = cx - wx * s2; V.y = cy - wy * s2;
    penWidths(); redraw();
  }
  const center = () => { const r = area.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };

  function setTool(t) {
    tool = t;
    box.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
    area.classList.toggle('hand', panMode());
    if (!pad) return;
    if (t === 'erase') Object.assign(pad, { compositeOperation:'destination-out', penColor:'#000' });
    else if (t !== 'hand') Object.assign(pad, { compositeOperation:'source-over', penColor: cssVar(t) });
    penWidths();
    panMode() ? padOff() : pad.on();
  }
  function fit() {
    if (!pad) return;
    const r = area.getBoundingClientRect();
    dpr = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    applyCtx(); pad.redraw();
  }
  function init() {
    if (pad) return true;
    if (!window.SignaturePad) { msg.hidden = false; hint.hidden = true; return false; }
    pad = new SignaturePad(canvas, { backgroundColor:'rgba(0,0,0,0)', throttle:8 });
    // точки — у координатах «світу», а не екрана
    const mk = pad._createPoint.bind(pad);
    pad._createPoint = (x, y, p) => { const pt = mk(x, y, p); pt.x = (pt.x - V.x) / V.s; pt.y = (pt.y - V.y) / V.s; return pt; };
    // очищати завжди весь холст, незалежно від масштабу
    const clr = pad.clear.bind(pad);
    pad.clear = () => { const c = canvas.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); clr(); applyCtx(); };
    setTool(tool);
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (Array.isArray(d)) pad.fromData(d); } catch (e) {}
    pad.addEventListener('endStroke', () => { save(); syncHint(); });
    new ResizeObserver(() => { if (!box.hidden) fit(); }).observe(area);
    return true;
  }

  // ---- жести: два пальці — масштаб і зсув; «Рука» — зсув одним пальцем/мишкою ----
  const ptrs = new Map();
  let gesture = null, busy = false, beforeLen = 0;   // busy — жест триває, поки не піднято всі пальці
  const local = e => { const r = area.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function startGesture() {
    busy = true;
    const pts = [...ptrs.values()];
    if (pts.length >= 2) {
      const [a, b] = pts, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
      gesture = { kind:'pinch', d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s0: V.s, wx: (cx - V.x) / V.s, wy: (cy - V.y) / V.s };
    } else gesture = { kind:'pan', px: pts[0][0], py: pts[0][1] };
  }
  area.addEventListener('pointerdown', e => {
    if (!pad || e.target.closest('.zoombar')) return;
    if (ptrs.size === 0) beforeLen = pad.toData().length;
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size >= 2) {
      // другий палець: скасовуємо лінію, яку встиг почати перший
      padOff();
      if (pad.toData().length > beforeLen) pad.fromData(pad.toData().slice(0, beforeLen));
      e.stopPropagation(); startGesture();
    } else if (panMode() || e.button === 1) {
      e.preventDefault(); e.stopPropagation(); padOff(); area.classList.add('panning'); startGesture();
    }
    try { area.setPointerCapture(e.pointerId); } catch (_) {}
  }, true);
  area.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, local(e));
    if (!gesture) return;
    e.preventDefault();
    const pts = [...ptrs.values()];
    if (gesture.kind === 'pinch' && pts.length >= 2) {
      const [a, b] = pts, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
      V.s = Math.min(MAX_S, Math.max(MIN_S, gesture.s0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / gesture.d0));
      V.x = cx - gesture.wx * V.s; V.y = cy - gesture.wy * V.s;
      redraw();
    } else if (gesture.kind === 'pan') {
      const [x, y] = pts[0];
      V.x += x - gesture.px; V.y += y - gesture.py; gesture.px = x; gesture.py = y;
      redraw();
    }
  });
  const up = e => {
    if (!ptrs.delete(e.pointerId)) return;
    if (ptrs.size === 0) {
      if (busy) { busy = false; gesture = null; area.classList.remove('panning'); penWidths(); if (!panMode()) pad.on(); }
    } else if (gesture && gesture.kind === 'pinch') gesture = null;   // лишився один палець — не малюємо, поки не підніметься
  };
  area.addEventListener('pointerup', up);
  area.addEventListener('pointercancel', up);
  area.addEventListener('wheel', e => {
    if (!pad) return;
    e.preventDefault();
    const [cx, cy] = local(e);
    if (e.ctrlKey || e.metaKey) zoomAt(cx, cy, V.s * Math.exp(-e.deltaY * 0.01));   // щипок на тачпаді або Ctrl + колесо
    else { V.x -= e.deltaX; V.y -= e.deltaY; redraw(); }
  }, { passive:false });

  document.getElementById('zoom-in').onclick = () => zoomAt(...center(), V.s * 1.25);
  document.getElementById('zoom-out').onclick = () => zoomAt(...center(), V.s / 1.25);
  zl.onclick = () => { V.s = 1; V.x = 0; V.y = 0; penWidths(); redraw(); };

  // ---- відкрити / закрити ----
  function open() {
    box.hidden = false; openBtn.hidden = true; openBtn.setAttribute('aria-expanded', 'true');
    document.body.classList.add('draft-on');
    if (init()) { fit(); redraw(); syncHint(); }
  }
  function close() {
    box.hidden = true; openBtn.hidden = false; openBtn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('draft-on'); openBtn.focus({ preventScroll:true });
  }
  function undo() { if (!pad) return; const d = pad.toData(); d.pop(); pad.fromData(d); save(); syncHint(); }

  openBtn.onclick = open;
  document.getElementById('draft-close').onclick = close;
  document.getElementById('draft-undo').onclick = undo;
  box.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  clearBtn.onclick = () => {
    if (!pad) return;
    if (!clearArm) {   // друге натискання протягом 3 с — очищення
      clearBtn.textContent = 'Точно?'; clearBtn.classList.add('warn');
      clearArm = setTimeout(() => { clearArm = null; clearBtn.innerHTML = TRASH; clearBtn.classList.remove('warn'); }, 3000);
      return;
    }
    clearTimeout(clearArm); clearArm = null; clearBtn.innerHTML = TRASH; clearBtn.classList.remove('warn');
    pad.clear(); save(); syncHint();
  };
  document.addEventListener('keydown', e => {
    if (box.hidden || e.target.closest('input')) return;
    if (e.key === 'Escape') close();
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomAt(...center(), V.s * 1.25); }
    else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomAt(...center(), V.s / 1.25); }
    else if (e.code === 'Space' && !spaceHand && !e.repeat && !e.target.closest('button')) { e.preventDefault(); spaceHand = true; setTool(tool); }
  });
  document.addEventListener('keyup', e => { if (e.code === 'Space' && spaceHand) { spaceHand = false; setTool(tool); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => setTool(tool));
})();
</script>
</html>
