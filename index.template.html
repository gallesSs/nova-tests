<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тести й тренажери</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{--paper:#f6f7fa;--grid:#e2e6ef;--ink:#151a26;--muted:#5a6377;--card:#fff;--line:#d5dbe6;--acc:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--paper:#11141b;--grid:#1c2130;--ink:#eef1f7;--muted:#9aa3b5;--card:#181d28;--line:#2b3242;--acc:#86a6ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Manrope",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:36px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:26px}
.eyebrow{font:700 12px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(30px,7vw,44px)/1.1 "Unbounded",system-ui,sans-serif;margin:6px 0 0}
p{margin:0;color:var(--muted);max-width:60ch}
h2{font:700 18px "Unbounded",system-ui,sans-serif;margin:0 0 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
a{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 16px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
a:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.g{font:700 12.5px "JetBrains Mono",monospace;color:var(--acc)}
.t{font-weight:700;min-width:0}
.go{font-weight:700;color:var(--muted)}
footer{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="eyebrow">Артур Гаврик · уроки</div><h1>Тести й тренажери</h1></header>
  <p>Теорія, тренування з поясненнями і тести. Результат тесту автоматично отримує вчитель — впиши ім'я та прізвище так, як тебе записали.</p>
<!--GROUPS-->
  <footer>Хімія · Алгебра · Фронтенд</footer>
</div>
</body>
</html>
