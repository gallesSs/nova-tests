<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style>
<title>Конспект — Юлія</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column on graph paper; three tabs (theory, problems, test); hydroxyl teal as the single accent */
:root{
  --paper:#f5f8f8; --grid:#e0e8e8; --ink:#13201f; --muted:#576867; --card:#ffffff; --line:#d1dcdb;
  --oh:#0b7a74; --oh-bg:#def1ef;
  --ok:#1f8f55; --ok-bg:#e3f5eb; --bad:#c9373a; --bad-bg:#fbe7e7; --warn-bg:#fff4dc; --warn:#9a6200;
  --c-stru:#2f6fd6; --c-nom:#8a4fd8; --c-prop:#2f8f5b; --c-react:#d47a1f; --c-prod:#9a6329; --c-calc:#0b7a74;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111716; --grid:#1b2423; --ink:#ecf3f2; --muted:#98a9a7; --card:#182120; --line:#2a3634;
  --oh:#4fc6bd; --oh-bg:#143331;
  --ok:#4fcf8a; --ok-bg:#15342a; --bad:#f07477; --bad-bg:#3a1c1f; --warn-bg:#3a2d12; --warn:#f2c46b;
  --c-stru:#6aa0f5; --c-nom:#b48af2; --c-prop:#5fc28c; --c-react:#f0a35a; --c-prod:#d9a066; --c-calc:#4fc6bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111716; --grid:#1b2423; --ink:#ecf3f2; --muted:#98a9a7; --card:#182120; --line:#2a3634;
  --oh:#4fc6bd; --oh-bg:#143331;
  --ok:#4fcf8a; --ok-bg:#15342a; --bad:#f07477; --bad-bg:#3a1c1f; --warn-bg:#3a2d12; --warn:#f2c46b;
  --c-stru:#6aa0f5; --c-nom:#b48af2; --c-prop:#5fc28c; --c-react:#f0a35a; --c-prod:#d9a066; --c-calc:#4fc6bd; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,8vw,52px);line-height:1}
h2{font-size:21px;line-height:1.25}
h3{font-size:15px;margin-top:6px}
p{margin:0;max-width:66ch}
.eyebrow{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.hint{font-size:13.5px;color:var(--muted)}
.f{font-family:var(--mono);font-weight:500;font-size:.94em}
sub,sup{font-size:.7em;line-height:0}
.hl{color:var(--oh);font-weight:700}

/* header + tabs */
.head{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ohbadge{font:700 clamp(18px,4.4vw,24px)/1 var(--mono);color:var(--oh);border:2px solid var(--oh);border-radius:10px;padding:6px 10px;background:var(--oh-bg)}
.tabs{display:flex;gap:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card);align-self:flex-start;max-width:100%}
.tab{font:700 15px var(--body);color:var(--ink);background:transparent;border:0;border-right:2px solid var(--ink);padding:10px 20px;cursor:pointer}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.segb:focus-visible,.dot:focus-visible,.toc button:focus-visible{outline:3px solid var(--oh);outline-offset:2px}

/* theory */
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc button,.segb{font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.toc button:hover,.segb:hover{border-color:var(--ink)}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec ul,.sec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.def{border:2px solid var(--oh);background:var(--oh-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.def .big{font:700 clamp(24px,6vw,30px)/1.2 var(--mono);color:var(--ink)}
.lbl{font:700 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sf{margin:0;border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sf pre{margin:0;font:500 15px/1.25 var(--mono);overflow-x:auto}
.sf figcaption{font-size:13px;color:var(--muted)}
.tblw{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.example{border-left:4px solid var(--oh);padding:6px 0 6px 14px}
.note{border:2px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.warn{background:var(--warn-bg);color:var(--ink);border:2px solid var(--warn);border-radius:12px;padding:12px 16px;font-size:15px}
.warn b{color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(92px,150px) 1fr;gap:10px;align-items:center;font-size:14px}
.bar .tr{position:relative;height:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:5px 0 0 5px}
.bar.hot .tr i{background:var(--oh)}
.bar .tr span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:700 12.5px var(--mono);font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(92px,150px) 1fr;gap:10px;font:500 11.5px var(--mono);color:var(--muted)}
.axis div{display:flex;justify-content:space-between}
.rx{display:grid;grid-template-columns:1fr;gap:10px}
.rxi{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rxn{font-weight:700;font-size:14.5px}
.eq{font-family:var(--mono);font-weight:500;font-size:15px;line-height:1.9;overflow-wrap:anywhere}
.arr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:-2px;margin:0 3px}
.arr small{font:500 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.use{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.use b{display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px var(--mono);border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}

/* tasks */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.task{display:flex;flex-direction:column;gap:14px}
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.count{font:700 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.q{font-size:18px;font-weight:700;line-height:1.5}
.q .f{font-size:.95em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:500 16px/1.45 var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font:700 13px var(--mono);border:2px solid currentColor;border-radius:6px;min-width:26px;height:26px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)} .opt.sel .k{color:var(--card);background:var(--ink);border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{color:var(--bad)}
.inrow{display:flex;align-items:stretch;max-width:360px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.inrow:focus-within{border-color:var(--ink)}
.inrow input{flex:1;min-width:0;font:500 17px var(--mono);color:var(--ink);background:transparent;border:0;padding:11px 14px;outline:none}
.unit{display:grid;place-items:center;padding:0 14px;font:700 14px var(--mono);color:var(--muted);border-left:2px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field input{font:500 16px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
.field input:focus{outline:none;border-color:var(--ink)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
.fb{border-left:4px solid var(--ink);padding:4px 0 4px 14px;font-size:15.5px}
.fb.ok{border-color:var(--ok)} .fb.ok b{color:var(--ok)}
.fb.bad{border-color:var(--bad)} .fb.bad b{color:var(--bad)}
.solbox{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.steps li::marker{font:700 13px var(--mono);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 15.5px var(--body);border:2px solid var(--ink);background:var(--ink);color:var(--card);border-radius:10px;padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--muted);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--muted)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--muted)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;font-size:14.5px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card);font:700 13px var(--mono);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--oh-bg);border-color:var(--oh);color:var(--ink)}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.score{display:flex;align-items:baseline;gap:12px}
.score .big{font:700 clamp(58px,15vw,84px)/1 var(--display)}
.score .of{font:700 20px var(--mono);color:var(--muted)}
.send{font-weight:700;font-size:14.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.send.ok{color:var(--ok)} .send.fail{color:var(--bad)} .send.wait{color:var(--muted)}
.review{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.review li{display:grid;grid-template-columns:26px 1fr;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.review li.bad{border-color:var(--bad)}
.review .m{font:700 16px var(--mono)}
.review li.ok .m{color:var(--ok)} .review li.bad .m{color:var(--bad)}
.review .rb{display:flex;flex-direction:column;gap:3px;font-size:15px;min-width:0}
.review .yours{color:var(--bad)} .review .right{color:var(--ok)}
.review .why{margin-top:4px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
footer{font-size:13px;color:var(--muted);text-align:center}

/* чернетка (signature_pad) */
.draft-fab{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:700 15px var(--body);display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--oh);color:#fff;border-radius:999px;padding:11px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.draft-fab svg{width:18px;height:18px}
.draft-fab:focus-visible,.dt:focus-visible{outline:3px solid var(--oh);outline-offset:2px}
.draft{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:2px solid var(--ink);box-shadow:-6px 0 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.draft-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line)}
.draft-bar .ttl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.draft-bar .sp{flex:1}
.dt svg{width:17px;height:17px}
.draft-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dt{font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:9px;min-width:36px;height:36px;padding:0 10px;cursor:pointer;display:inline-grid;place-items:center}
.dt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dt i{display:block;width:16px;height:16px;border-radius:50%}
.dt.warn{border-color:var(--bad);color:var(--bad)}
.draft-area{position:relative;flex:1;min-height:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.draft-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.draft-msg{position:absolute;inset:auto 16px 16px 16px;background:var(--card);border:2px solid var(--bad);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14.5px}
.draft-hint{position:absolute;left:12px;bottom:14px;font-size:12.5px;color:var(--muted);pointer-events:none}

.zoombar{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px;z-index:2}
.zoombar .dt{min-width:32px;height:32px;border:0}
.zoombar .zl{font:700 12.5px var(--mono);font-variant-numeric:tabular-nums;min-width:52px}
.draft-area.hand canvas{cursor:grab}
.draft-area.panning canvas{cursor:grabbing}
@media (max-width:700px){
  .draft{top:auto;left:0;width:auto;height:60vh;border-left:0;border-top:2px solid var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 0 rgba(0,0,0,.08);padding-left:env(safe-area-inset-left,0px)}
  body.draft-on .wrap{padding-bottom:62vh}
}
@media (min-width:701px){ body.draft-on{padding-right:460px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>
.topics{display:flex;flex-direction:column;gap:14px}
.tp{border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.tp>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:baseline;padding:16px 18px}
.tp>summary::-webkit-details-marker{display:none}
.tp .dt{font:700 13px var(--mono);color:var(--muted);white-space:nowrap}
.tp .tt{font-weight:800;font-size:18px;flex:1;min-width:0}
.tp .chev{font:700 18px var(--mono);color:var(--muted);transition:transform .2s}
.tp[open] .chev{transform:rotate(90deg)}
.tp .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.tp .in h3{margin:12px 0 0;font-size:16px}
.keys{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.keys li{font:600 14.5px/1.5 var(--mono);background:var(--paper,var(--line));padding:7px 10px;border-radius:8px;overflow-wrap:anywhere}
.sq{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.sq:first-child{border-top:none}
.sq .opts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));display:grid;gap:8px}
.sq .why{font-size:14px;color:var(--muted)}
.months{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;font:700 12px var(--mono);padding:2px 8px;border-radius:6px;border:2px solid var(--oh);color:var(--oh);margin-left:8px;vertical-align:2px}
</style>
<div class="wrap">
  <header class="head">
    <div class="eyebrow" id="h-eyebrow"></div>
    <div class="brand"><h1 id="h-name"></h1><span class="ohbadge" aria-hidden="true">📒</span></div>
    <nav class="tabs" role="tablist" aria-label="Розділи">
      <button class="tab" role="tab" data-v="konspekt" aria-selected="true">Конспект</button>
      <button class="tab" role="tab" data-v="test" aria-selected="false">Тестування за місяць</button>
      <button class="tab" role="tab" data-v="igry" aria-selected="false">Ігри</button>
    </nav>
  </header>
  <section id="v-konspekt" class="stack"></section>
  <section id="v-test" class="stack" hidden></section>
  <section id="v-igry" class="stack" hidden></section>
  <footer>Хімія з Артуром Валентиновичем · NovaШкола</footer>
</div>
<script>
const DATA = {"slug": "yuliia", "first": "Юлія", "full": "Юлія Ляхович", "grade": "10 клас", "openTests": ["2026-11"], "topics": [{"date": "2026-11-18", "title": "Спирти", "link": "../../chem-10-spyrty/", "text": "<p>Спирти — органічні сполуки з гідроксильною групою –OH, сполученою з атомом Карбону в sp<sup>3</sup>-стані. Загальна формула насичених одноатомних спиртів C<sub>n</sub>H<sub>2n+1</sub>OH. Назва: суфікс «-ол», нумерацію ведуть з того боку, ближче до якого стоїть OH.</p><p>Між молекулами спиртів утворюються водневі зв'язки, тому спирти киплять набагато вище за алкани зі схожою масою, а нижчі спирти необмежено змішуються з водою.</p>", "keys": ["C<sub>n</sub>H<sub>2n+1</sub>OH — гомологічний ряд спиртів", "2C<sub>2</sub>H<sub>5</sub>OH + 2Na → 2C<sub>2</sub>H<sub>5</sub>ONa + H<sub>2</sub>↑", "C<sub>2</sub>H<sub>5</sub>OH + HBr → C<sub>2</sub>H<sub>5</sub>Br + H<sub>2</sub>O", "C<sub>2</sub>H<sub>5</sub>OH → C<sub>2</sub>H<sub>4</sub> + H<sub>2</sub>O (H<sub>2</sub>SO<sub>4</sub>, t > 170 °C)", "C<sub>2</sub>H<sub>5</sub>OH + 3O<sub>2</sub> → 2CO<sub>2</sub> + 3H<sub>2</sub>O"], "tasks": [{"q": "Загальна формула насичених одноатомних спиртів:", "o": ["C<sub>n</sub>H<sub>2n+1</sub>OH", "C<sub>n</sub>H<sub>2n</sub>", "C<sub>n</sub>H<sub>2n+2</sub>", "C<sub>n</sub>H<sub>2n−2</sub>"], "e": "Спирт — це R–OH, де R — алкіл C<sub>n</sub>H<sub>2n+1</sub>."}, {"q": "Назва сполуки CH<sub>3</sub>–CH(OH)–CH<sub>3</sub>:", "o": ["пропан-2-ол", "пропан-1-ол", "пропан-3-ол", "2-метилетанол"], "e": "Три атоми Карбону — «пропан», група OH при другому атомі."}, {"q": "Чому етанол кипить при +78 °C, а пропан зі схожою масою — при −42 °C?", "o": ["Між молекулами спирту утворюються водневі зв'язки", "Етанол має значно більшу молярну масу", "В етанолі є подвійний зв'язок", "Пропан — йонна сполука"], "e": "Водневі зв'язки O–H···O треба розірвати, на це йде додаткова енергія."}, {"q": "Що утворюється при взаємодії етанолу з натрієм?", "o": ["натрій етилат і водень", "етилен і вода", "натрій гідроксид і етан", "етаналь і водень"], "e": "Натрій заміщує атом Гідрогену групи OH."}, {"q": "Що утворюється при внутрішньомолекулярній дегідратації етанолу (H<sub>2</sub>SO<sub>4</sub>, t > 170 °C)?", "o": ["етилен C<sub>2</sub>H<sub>4</sub>", "діетиловий етер", "етаналь", "етанова кислота"], "e": "Від молекули відщеплюється вода — утворюється подвійний зв'язок."}, {"q": "Скільки існує спиртів складу C<sub>3</sub>H<sub>7</sub>OH?", "o": ["2", "1", "3", "4"], "e": "Пропан-1-ол і пропан-2-ол."}]}, {"date": "2026-11-25", "title": "Гліцерол. Фенол", "link": "../../chem-10-glitserol-fenol/", "text": "<p><b>Гліцерол</b> (пропан-1,2,3-тріол) — триатомний спирт, в'язка солодкувата рідина. Кілька груп OH поруч посилюють кислотні властивості, тому гліцерол, на відміну від етанолу, реагує зі свіжоосадженим Cu(OH)<sub>2</sub>: утворюється яскраво-синій розчин. Це якісна реакція на багатоатомні спирти.</p><p><b>Фенол</b> C<sub>6</sub>H<sub>5</sub>OH — група OH сполучена безпосередньо з бензеновим кільцем. Кільце відтягує електрони, тому фенол — слабка кислота і реагує з лугами (спирти — ні). А група OH активує кільце: з бромною водою одразу випадає білий осад.</p>", "keys": ["гліцерол + Cu(OH)<sub>2</sub> → яскраво-синій розчин (якісна реакція)", "C<sub>6</sub>H<sub>5</sub>OH + NaOH → C<sub>6</sub>H<sub>5</sub>ONa + H<sub>2</sub>O", "C<sub>6</sub>H<sub>5</sub>OH + 3Br<sub>2</sub> → C<sub>6</sub>H<sub>2</sub>Br<sub>3</sub>OH↓ + 3HBr (білий осад)", "фенол + FeCl<sub>3</sub> → фіолетове забарвлення"], "tasks": [{"q": "Якісна реакція на гліцерол:", "o": ["Cu(OH)<sub>2</sub> — яскраво-синій розчин", "бромна вода — білий осад", "FeCl<sub>3</sub> — фіолетове забарвлення", "реакція «срібного дзеркала»"], "e": "Кілька сусідніх груп OH утворюють з Купрумом комплекс синього кольору."}, {"q": "Яка з речовин реагує з розчином NaOH?", "o": ["фенол", "етанол", "гліцерол", "метанол"], "e": "Фенол — слабка кислота через вплив бензенового кільця на групу OH."}, {"q": "Скільки гідроксильних груп у молекулі гліцеролу?", "o": ["3", "1", "2", "6"], "e": "Пропан-1,2,3-тріол — по одній OH при кожному атомі Карбону."}, {"q": "Що утворюється при взаємодії фенолу з бромною водою?", "o": ["2,4,6-трибромфенол (білий осад)", "бромбензен", "бромоетан", "натрій фенолят"], "e": "OH активує положення 2, 4, 6 кільця — бром заміщує там Гідроген."}, {"q": "Чим можна розрізнити розчини фенолу та етанолу?", "o": ["FeCl<sub>3</sub> — з фенолом фіолетове забарвлення", "натрієм", "Cu(OH)<sub>2</sub>", "лакмусом"], "e": "З натрієм реагують обидві речовини, з Cu(OH)₂ — жодна, лакмус фенол не змінює."}, {"q": "Формула фенолу:", "o": ["C<sub>6</sub>H<sub>5</sub>OH", "C<sub>6</sub>H<sub>5</sub>CH<sub>2</sub>OH", "C<sub>6</sub>H<sub>6</sub>", "C<sub>3</sub>H<sub>5</sub>(OH)<sub>3</sub>"], "e": "C₆H₅CH₂OH — бензиловий спирт: OH не при кільці."}]}]};
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwJt0FC8AbiZQi9ZByBeCdRuD8BOnVZMpK2fuoZ2KJNqt8k7bayhczqiv_50-ftWhumeA/exec';
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };
const MONTHS = ['січень', 'лютий', 'березень', 'квітень', 'травень', 'червень', 'липень', 'серпень', 'вересень', 'жовтень', 'листопад', 'грудень'];
const MONTHS_G = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const dLabel = d => { const [y, m, dd] = d.split('-').map(Number); return `${dd} ${MONTHS_G[m - 1]}`; };
const LETTERS = 'АБВГД';

$('h-eyebrow').textContent = `Хімія · ${DATA.grade} · особистий конспект`;
$('h-name').textContent = DATA.first;
document.title = `Конспект — ${DATA.first}`;

/* ---------- конспект ---------- */
function renderKonspekt() {
  const v = $('v-konspekt'), list = DATA.topics.slice().reverse();
  v.innerHTML = `<p class="hint">Тут збираються всі теми наших уроків — нові зверху. Відкрий тему, перечитай головне і перевір себе.</p>
    <div class="topics">${list.map((t, i) => `
    <details class="tp" ${i === 0 ? 'open' : ''}>
      <summary><span class="dt">${dLabel(t.date)}</span><span class="tt">${t.title}${t.sr ? '<span class="badge">СР</span>' : ''}</span><span class="chev">›</span></summary>
      <div class="in">
        ${t.text ? `<div>${t.text}</div>` : ''}
        ${t.keys && t.keys.length ? `<h3>Головне</h3><ul class="keys">${t.keys.map(k => `<li>${k}</li>`).join('')}</ul>` : ''}
        ${t.tasks && t.tasks.length ? `<h3>Перевір себе</h3><div class="selfq" data-t="${DATA.topics.indexOf(t)}"></div>` : ''}
        ${t.link ? `<div class="actions"><a class="btn ghost" href="${t.link}" target="_blank" rel="noopener">Більше теорії і задач →</a></div>` : ''}
      </div>
    </details>`).join('')}</div>`;
  v.querySelectorAll('.selfq').forEach(box => {
    const t = DATA.topics[+box.dataset.t];
    box.innerHTML = t.tasks.map((q, k) => { const o = shuffle(q.o.map((h, i) => ({ h, r: i === 0 })));
      return `<div class="sq"><b>${k + 1}. ${q.q}</b><div class="opts">${o.map((x, i) => `<button class="opt" data-r="${x.r ? 1 : 0}"><span class="k">${LETTERS[i]}</span><span>${x.h}</span></button>`).join('')}</div><div class="why" hidden>${q.e || ''}</div></div>`; }).join('');
    box.querySelectorAll('.sq').forEach(sq => sq.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (sq.dataset.done) return; sq.dataset.done = 1;
      b.classList.add(b.dataset.r === '1' ? 'ok' : 'bad'); sq.querySelector('[data-r="1"]').classList.add('ok'); sq.querySelector('.why').hidden = false;
      sq.querySelectorAll('.opt').forEach(x => x.disabled = true);
    }));
  });
}

/* ---------- тестування за місяць ---------- */
const T = { phase:'start', month:null, name: DATA.full, tasks:[], i:0, sent:'' };
const monthsAvail = () => [...new Set(DATA.topics.filter(t => t.tasks && t.tasks.length).map(t => t.date.slice(0, 7)))];
const openMonths = () => DATA.openTests || [];
function renderTest() {
  const v = $('v-test');
  if (T.phase === 'start') {
    const open = openMonths().filter(m => monthsAvail().includes(m));
    v.innerHTML = `<div class="card stack">
      <div><div class="eyebrow">Раз на місяць</div><h2 style="margin-top:4px">Тестування за місяць</h2></div>
      ${open.length ? `<p>Тест за темами, які ми пройшли цього місяця. Результат прийде вчителю.</p>
        <label class="field">Ім'я та прізвище<input id="t-name" value="${esc(T.name)}"></label>
        <div class="months">${open.map(m => { const [y, mm] = m.split('-').map(Number); return `<button class="btn" data-m="${m}">Почати: ${MONTHS[mm - 1]} ${y}</button>`; }).join('')}</div>`
        : `<p>Тестування ще не відкрите. Вчитель відкриє його в кінці місяця — тоді тут з'явиться кнопка.</p>`}
    </div>`;
    if ($('t-name')) $('t-name').oninput = e => T.name = e.target.value;
    v.querySelectorAll('[data-m]').forEach(b => b.onclick = () => startTest(b.dataset.m));
    return;
  }
  if (T.phase === 'run') {
    const t = T.tasks[T.i], N = T.tasks.length, last = T.i === N - 1;
    v.innerHTML = `<div class="dots">${T.tasks.map((x, j) => `<button class="dot ${x.ans !== null ? 'done' : ''} ${j === T.i ? 'cur' : ''}" data-j="${j}">${j + 1}</button>`).join('')}</div>
      <div class="card task" style="--c:var(--c-stru)"><div class="tline"><span class="tag">${esc(t.topic)}</span><span class="count">${T.i + 1} / ${N}</span></div>
      <div class="q">${t.q}</div>
      <div class="opts">${t.opts.map((o, i) => `<button class="opt ${t.ans === i ? 'sel' : ''}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${o.h}</span></button>`).join('')}</div>
      <div class="actions"><button class="btn ghost" id="t-prev" ${T.i ? '' : 'disabled'}>Назад</button>${last ? '<button class="btn" id="t-fin">Завершити</button>' : '<button class="btn" id="t-next">Далі</button>'}</div></div>`;
    v.querySelectorAll('.dot').forEach(b => b.onclick = () => { T.i = +b.dataset.j; renderTest(); });
    v.querySelectorAll('.opt').forEach(b => b.onclick = () => { t.ans = +b.dataset.i; if (!last) T.i++; renderTest(); });
    $('t-prev').onclick = () => { T.i--; renderTest(); };
    if ($('t-next')) $('t-next').onclick = () => { T.i++; renderTest(); };
    if ($('t-fin')) $('t-fin').onclick = finish;
    return;
  }
  const got = T.tasks.filter(t => t.ans !== null && t.opts[t.ans].r).length, N = T.tasks.length, mark = Math.max(1, Math.round(got / N * 12));
  v.innerHTML = `<div class="card stack"><div class="eyebrow">${esc(T.name)}</div><div class="score"><span class="big">${mark}</span><span class="of">з 12</span></div>
    <div class="hint">Правильно ${got} з ${N}</div><div class="send ${T.sent || 'wait'}" id="t-send">${T.sent === 'ok' ? 'Результат надіслано вчителю.' : T.sent === 'fail' ? 'Не вдалося надіслати. <button class="btn ghost" id="t-resend">Ще раз</button>' : 'Надсилаю результат…'}</div></div>
    <div class="card stack"><h2>Розбір</h2><ol class="review">${T.tasks.map((t, i) => { const ok = t.ans !== null && t.opts[t.ans].r;
      return `<li class="${ok ? 'ok' : 'bad'}"><span class="m">${ok ? '✓' : '✗'}</span><div class="rb"><b>${i + 1}. ${t.q}</b>${ok ? '' : `<div class="yours">Твоя відповідь: ${t.ans === null ? '—' : t.opts[t.ans].h}</div><div class="right">Правильно: <b>${t.right}</b></div>${t.e ? `<div class="why">${t.e}</div>` : ''}`}</div></li>`; }).join('')}</ol></div>`;
  if ($('t-resend')) $('t-resend').onclick = send;
}
function startTest(m) {
  const pool = DATA.topics.filter(t => t.date.startsWith(m)).flatMap(t => (t.tasks || []).map(q => ({ ...q, topic: t.title.replace(/<[^>]+>/g, '') })));
  T.month = m; T.tasks = shuffle(pool).slice(0, 15).map(q => ({ ...q, opts: shuffle(q.o.map((h, i) => ({ h, r: i === 0 }))), right: q.o[0], ans: null }));
  T.i = 0; T.phase = 'run'; T.sent = ''; renderTest(); window.scrollTo({ top:0 });
}
function finish() { T.phase = 'done'; renderTest(); send(); }
function send() {
  const got = T.tasks.filter(t => t.ans !== null && t.opts[t.ans].r).length, N = T.tasks.length, [y, mm] = T.month.split('-').map(Number);
  const topic = `Тестування за ${MONTHS[mm - 1]} ${y}`;
  const details = [topic, ...T.tasks.map((t, i) => { const ok = t.ans !== null && t.opts[t.ans].r; return `${ok ? '✓' : '✗'} ${i + 1}. [${t.topic}] ${plain(t.q)}${ok ? '' : `\n     відповів: «${t.ans === null ? '—' : plain(t.opts[t.ans].h)}» → правильно: «${plain(t.right)}»`}`; })].join('\n');
  T.sent = 'wait';
  fetch(SHEET_URL, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: T.name.trim(), cls: DATA.grade, topic, score: `${got}/${N}`, mark: Math.max(1, Math.round(got / N * 12)), details }) })
    .then(() => { T.sent = 'ok'; renderTest(); }).catch(() => { T.sent = 'fail'; renderTest(); });
}

/* ---------- ігри ---------- */
function renderIgry() {
  $('v-igry').innerHTML = `<div class="card stack"><h2>Хімічні челенджі</h2><p>Ігри до наших тем. Результат можна надіслати вчителю — у кінці гри натисни «Надіслати результат».</p>
    <div class="actions"><a class="btn" href="../../igry/" target="_blank" rel="noopener">Відкрити ігри →</a></div></div>`;
}

/* ---------- вкладки ---------- */
const VIEWS = ['konspekt', 'test', 'igry'];
function show(v) { if (!VIEWS.includes(v)) v = 'konspekt'; VIEWS.forEach(x => $('v-' + x).hidden = x !== v);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  if (v === 'test' && T.phase === 'start') renderTest(); if (v === 'igry') renderIgry(); }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { show(b.dataset.v); try { history.replaceState(null, '', '#' + b.dataset.v); } catch (e) {} });
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
renderKonspekt(); show(location.hash.slice(1));
</script>
